    {t:"春季 石山寺と紫式部展 最終日",c:"ev-blue",cat:"文化展示",date:"6月30日（火）まで",loc:"石山寺（大津市石山寺）"},
    {t:"ビアガーデン最終日",c:"ev-coral",cat:"グルメ",date:"6月30日（火）まで",loc:"ブランチ大津京 コミュニティエリア"}
  ]
};

function isHol(mi,d){return (MONTHS[mi].holidays||[]).includes(d)}

function buildMonth(mi){
  const m=MONTHS[mi];
  const el=document.getElementById("m"+mi);
  let h=`<div style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:10px">${m.name}</div>`;
  h+=`<div class="cal-grid">`;
  // ヘッダー行
  DOW.forEach((d,i)=>{
    const cls=i===0?"sun":i===6?"sat":"";
    h+=`<div class="dh ${cls}">${d}</div>`;
  });
  // 月頭の空白
  for(let i=0;i<m.start;i++) h+=`<div class="dc empty"></div>`;
  // 日付セル
  for(let d=1;d<=m.days;d++){
    // 実際の曜日: (start + d - 1) % 7
    const dow=(m.start+d-1)%7;
    const isToday=(mi===0&&d===20);
    const hol=isHol(mi,d);
    const nc=hol||dow===0?"hol":dow===6?"sat":"";
    const evs=EVENTS[`${mi}-${d}`]||[];
    let pills="";
    evs.slice(0,3).forEach((e,ei)=>{
      pills+=`<div class="pill ${e.c}" onclick="openModal(${mi},${d},${ei})">${e.t}</div>`;
    });
    if(evs.length>3) pills+=`<div style="font-size:10px;color:var(--color-text-tertiary);padding:1px 4px">+${evs.length-3}件</div>`;
    h+=`<div class="dc${isToday?" today":""}"><div class="dn ${nc}">${d}</div>${pills}</div>`;
  }
  // 月末の空白
  const total=m.start+m.days;
  const rem=(7-total%7)%7;
  for(let i=0;i<rem;i++) h+=`<div class="dc empty"></div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

function showM(idx){
  document.querySelectorAll(".mblock").forEach((el,i)=>el.classList.toggle("visible",i===idx));
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",i===idx));
}

function openModal(mi,d,ei){
  const e=EVENTS[`${mi}-${d}`][ei];
  let rows="";
  const add=(label,val)=>{if(val) rows+=`<div class="modal-row"><span class="modal-label">${label}</span><span class="modal-val">${val}</span></div>`};
  add("日時",e.date+(e.time?" "+e.time:""));
  add("場所",e.loc);
  if(e.target) add("対象",e.target);
  if(e.cap) add("定員",e.cap);
  if(e.stuff) add("持ち物",e.stuff);
  if(e.note) rows+=`<hr class="modal-divider"><div style="font-size:12px;color:var(--color-text-secondary);line-height:1.6">${e.note}</div>`;
  document.getElementById("modal-body").innerHTML=
    `<div class="modal-tag ${e.c}">${e.cat||"イベント"}</div>
     <div class="modal-title">${e.t}</div>${rows}`;
  document.getElementById("overlay").classList.add("open");
}

function closeModal(ev){
  if(!ev||ev.target===document.getElementById("overlay")||ev.currentTarget.classList.contains("modal-close"))
    document.getElementById("overlay").classList.remove("open");
}

MONTHS.forEach((_,i)=>buildMonth(i));
</script>
