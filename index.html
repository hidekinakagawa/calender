.wrap{padding:16px 16px 8px;max-width:700px;margin:0 auto}
h1{font-size:17px;font-weight:600;color:#1d1d1f;margin-bottom:14px}

/* 表示切り替えタブ */
.view-tabs{display:flex;background:#e5e5ea;border-radius:10px;padding:2px;margin-bottom:14px;width:fit-content}
.view-tab{padding:6px 20px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:#636366;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.view-tab.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,0.12)}

/* 月タブ */
.month-tabs{display:flex;gap:8px;margin-bottom:14px}
.month-tab{padding:7px 20px;border-radius:20px;border:1.5px solid #d1d1d6;font-size:14px;font-weight:500;cursor:pointer;background:#fff;color:#636366;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.month-tab.active{background:#0071e3;color:#fff;border-color:#0071e3}

/* カレンダー */
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.cal-scroll::-webkit-scrollbar{height:4px}
.cal-scroll::-webkit-scrollbar-track{background:#f0f0f0;border-radius:2px}
.cal-scroll::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:2px}
.cal-wrap{min-width:560px;width:560px}
.month-label{font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,80px);gap:1px;background:#e5e5ea;border-radius:12px;overflow:hidden;border:1px solid #e5e5ea;width:100%}
.dh{background:#f2f2f7;padding:6px 2px;text-align:center;font-size:11px;font-weight:600;color:#636366}
.dh.sun{color:#ff3b30}
.dh.sat{color:#007aff}
.dc{background:#fff;min-height:86px;padding:5px 4px}
.dc.empty{background:#f9f9fb}
.dc.today{outline:2px solid #0071e3;outline-offset:-2px;background:#f0f7ff}
.dn{font-size:11px;font-weight:600;color:#636366;margin-bottom:4px;line-height:1}
.dn.sun,.dn.hol{color:#ff3b30}
.dn.sat{color:#007aff}
.dn.today-num{color:#0071e3}
.pill{font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;margin-bottom:2px;cursor:pointer;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:opacity 0.1s;border:none;width:100%;text-align:left}
.pill:active{opacity:0.65}
.cal-more{font-size:10px;color:#0071e3;padding:2px 4px;background:none;border:none;cursor:pointer;text-align:left;font-weight:600;-webkit-tap-highlight-color:transparent;border-radius:3px}
.cal-more:active{background:#e8f2fd}

/* 凡例 */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.leg{display:inline-block;font-size:10px;font-weight:500;padding:3px 8px;border-radius:3px}

/* リスト */
.day-group{margin-bottom:16px}
.day-header{font-size:12px;font-weight:600;color:#8e8e93;padding:4px 0 6px;border-bottom:1px solid #e5e5ea;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dow-badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:#e5e5ea;color:#636366}
.dow-badge.sun,.dow-badge.hol{background:#ffeeee;color:#ff3b30}
.dow-badge.sat{background:#eef4ff;color:#007aff}
.ev-row{display:flex;align-items:flex-start;gap:10px;padding:10px;background:#fff;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid #f0f0f0;transition:background 0.1s;-webkit-tap-highlight-color:transparent}
.ev-row:active{background:#f5f5f7}
.ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.ev-info{flex:1;min-width:0}
.ev-name{font-size:14px;font-weight:500;color:#1d1d1f;line-height:1.4;margin-bottom:2px}
.ev-sub{font-size:11px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-cat{flex-shrink:0;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;align-self:center;white-space:nowrap}
.ev-arrow{font-size:14px;color:#c7c7cc;align-self:center;flex-shrink:0}

/* カラー共通 */

.ev-blue{background:#e8f2fd;color:#0c447c}

.view-panel.active{display:block}
.mblock{display:none}

.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:420px;position:relative;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:popIn 0.18s ease;box-shadow:0 8px 40px rgba(0,0,0,0.25)}
@keyframes popIn{from{transform:scale(0.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:#e5e5ea;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#636366;-webkit-tap-highlight-color:transparent}

.modal-link:active{background:#f0f7ff}
.modal-src{font-size:12px;color:#8e8e93;margin-top:10px;font-style:italic}

function isHol(mi,d){return(MONTHS[mi].holidays||[]).includes(d)}

// その日だけのイベントか判定（dateに「〜」「まで」「〜」が含まれない＝単日）
function isSingleDay(e){
  return !e.date.includes("〜") && !e.date.includes("まで") && !e.date.includes("～");
}

// 表示順ソート：単日イベントを先に、複数日イベントを後に
function sortEvs(evs){
  const single=evs.filter(e=>isSingleDay(e));
  const multi=evs.filter(e=>!isSingleDay(e));
  return [...single,...multi];
}

function buildCal(mi){
  const m=MONTHS[mi];
  const el=document.getElementById("cal-m"+mi);
  let h=`<div class="month-label">${m.name}</div><div class="cal-grid">`;
  DOW.forEach((d,i)=>{
    const cls=i===0?"sun":i===6?"sat":"";
    h+=`<div class="dh ${cls}">${d}</div>`;
  });
  for(let i=0;i<m.start;i++) h+=`<div class="dc empty"></div>`;
  for(let d=1;d<=m.days;d++){
    const dow=(m.start+d-1)%7;
    const isToday=(mi===TODAY_MI&&d===TODAY_D);
    const hol=isHol(mi,d);
    const nc=hol||dow===0?"hol":dow===6?"sat":"";
    const evs=sortEvs(EVENTS[`${mi}-${d}`]||[]);
    let pills="";
    evs.slice(0,3).forEach((e,ei)=>{
      // ソート後のインデックスを元のEVENTSでのインデックスに変換
      const origEi=(EVENTS[`${mi}-${d}`]||[]).indexOf(e);
      pills+=`<button class="pill ${e.c}" onclick="openModal(${mi},${d},${origEi})">${e.t}</button>`;
    });
    if(evs.length>3){
      pills+=`<button class="cal-more" onclick="jumpToList(${mi},${d})">+${evs.length-3}件 ›</button>`;
    }
    h+=`<div class="dc${isToday?" today":""}"><div class="dn ${nc}${isToday?" today-num":""}">${d}</div>${pills}</div>`;
  }
  const total=m.start+m.days;
  const rem=(7-total%7)%7;
  for(let i=0;i<rem;i++) h+=`<div class="dc empty"></div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

function buildList(mi){
  const m=MONTHS[mi];
  const el=document.getElementById("list-m"+mi);
  let html="";
  for(let d=1;d<=m.days;d++){
    const evs=EVENTS[`${mi}-${d}`];
    if(!evs||evs.length===0) continue;
    const dow=(m.start+d-1)%7;
    const hol=isHol(mi,d);
    const dowCls=hol||dow===0?"hol":dow===6?"sat":"";
    // アンカーIDをday-groupに付与
    html+=`<div class="day-group" id="list-day-${mi}-${d}">
      <div class="day-header">
        <span>${MONTH_NUMS[mi]}月${d}日</span>
        <span class="dow-badge ${dowCls}">${DOW[dow]}</span>
      </div>`;
    evs.forEach((e,ei)=>{
      const sub=[e.time,e.loc].filter(Boolean).join("　");
      html+=`<div class="ev-row" onclick="openModal(${mi},${d},${ei})">
        <div class="ev-dot ${DOT[e.c]||'dot-blue'}"></div>
        <div class="ev-info">
          <div class="ev-name">${e.t}</div>
          <div class="ev-sub">${sub}</div>
        </div>
        <div class="ev-cat ${e.c}">${e.cat}</div>
        <div class="ev-arrow">›</div>
      </div>`;
    });
    html+=`</div>`;
  }
  el.innerHTML=html;
}

function showView(view){
  document.querySelectorAll(".view-tab").forEach(el=>{
    el.classList.toggle("active", el.textContent.includes(view==="cal"?"カレンダー":"リスト"));
  });
  document.getElementById("view-cal").classList.toggle("active", view==="cal");
  document.getElementById("view-list").classList.toggle("active", view==="list");
  // リスト表示に切り替えた時、今日以降の最初のイベントにスクロール
  if(view==="list"){
    setTimeout(()=>{
      // 今月のリストで今日以降の最初の日を探す
      const mi=getCurrentMonthIdx();
      if(mi<0||mi>2) return;
      // 今日以降の最初のイベントIDを探す
      let targetId=null;
      for(let d=TODAY_D;d<=MONTHS[mi].days;d++){
        const el=document.getElementById(`list-day-${mi}-${d}`);
        if(el){targetId=`list-day-${mi}-${d}`;break;}
      }
      if(targetId){
        const target=document.getElementById(targetId);
        if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
      }
    },80);
  }
}

function getCurrentMonthIdx(){
  // 現在表示中の月インデックスを返す
  let idx=0;
  document.querySelectorAll(".month-tab").forEach((el,i)=>{if(el.classList.contains("active")) idx=i;});
  return idx;
}

function showMonth(idx){
  ["cal","list"].forEach(v=>{
    document.querySelectorAll(`#view-${v} .mblock`).forEach((el,i)=>el.classList.toggle("visible",i===idx));
  });
  document.querySelectorAll(".month-tab").forEach((el,i)=>el.classList.toggle("active",i===idx));
}

// +N件クリック：リストビューに切り替えてその日にスクロール
function jumpToList(mi,d){
  // 月タブを合わせる
  showMonth(mi);
  // リストビューに切り替え
  showView("list");
  // スクロール（少し遅延させてDOM更新を待つ）
  setTimeout(()=>{
    const target=document.getElementById(`list-day-${mi}-${d}`);
    if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
    // ハイライト
    target.style.background="#fffbe6";
    target.style.borderRadius="10px";
    setTimeout(()=>{target.style.background="";target.style.borderRadius="";},1500);
  },80);
}

function openModal(mi,d,ei){
  const e=EVENTS[`${mi}-${d}`][ei];
  let rows="";
  const add=(label,val)=>{if(val) rows+=`<div class="modal-row"><span class="modal-label">${label}</span><span class="modal-val">${val}</span></div>`};
  add("日時", e.date+(e.time?" "+e.time:""));
  add("場所", e.loc);
  if(e.target) add("対象", e.target);
  if(e.cap)    add("定員", e.cap);
  if(e.stuff)  add("持ち物", e.stuff);
  if(e.note)   rows+=`<hr class="modal-divider"><div class="modal-note">${e.note}</div>`;

  let footer="";
  if(e.url){
    footer=`<hr class="modal-divider"><a class="modal-link" href="${e.url}" target="_blank">詳細・申込ページへ ↗</a>`;
    if(e.src2) footer+=`<div style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;font-style:italic">${e.src2}</div>`;
  } else if(e.src){
    footer=`<hr class="modal-divider"><div class="modal-src">情報提供：${e.src}</div>`;
  }

  document.getElementById("modal-body").innerHTML=
    `<div class="modal-tag ${e.c}">${e.cat}</div><div class="modal-title">${e.t}</div>${rows}${footer}`;
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeModal(ev){
  if(!ev||ev.target===document.getElementById("overlay")||ev.currentTarget.classList.contains("modal-close")){
    document.getElementById("overlay").classList.remove("open");
    document.body.style.overflow="";
  }
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeModal()});

MONTHS.forEach((_,i)=>{buildCal(i);buildList(i);});

// 開いた時に今月を自動表示（範囲外なら最初の月）
const initMI=(TODAY_MI>=0&&TODAY_MI<=2)?TODAY_MI:0;
if(initMI!==0) showMonth(initMI);

// 初期表示がリストの場合も今日スクロール対応（カレンダーがデフォルトなので通常は不要だが念のため）
document.querySelectorAll(".view-tab").forEach(el=>{
  if(el.classList.contains("active")&&el.textContent.includes("リスト")){
    setTimeout(()=>showView("list"),100);
  }
});
</script>
</body>
</html>
