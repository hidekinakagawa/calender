<head>

<title>大津市イベントカレンダー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f5f5f7;color:#1d1d1f}

.wrap{padding:16px;max-width:700px;margin:0 auto}
h1{font-size:17px;font-weight:600;color:#1d1d1f;margin-bottom:14px;letter-spacing:0.01em}

/* タブ */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{padding:7px 20px;border-radius:20px;border:1.5px solid #d1d1d6;font-size:14px;font-weight:500;cursor:pointer;background:#fff;color:#636366;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.tab.active{background:#0071e3;color:#fff;border-color:#0071e3}

/* カレンダー横スクロールラッパー */
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px}
.cal-scroll::-webkit-scrollbar{height:4px}
.cal-scroll::-webkit-scrollbar-track{background:#f0f0f0;border-radius:2px}
.cal-scroll::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:2px}

.cal-wrap{min-width:350px}
.month-label{font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e5e5ea;border-radius:12px;overflow:hidden;border:1px solid #e5e5ea}

/* 曜日ヘッダー */
.dh{background:#f2f2f7;padding:6px 2px;text-align:center;font-size:11px;font-weight:600;color:#636366}
.dh.sun{color:#ff3b30}
.dh.sat{color:#007aff}

/* 日付セル */
.dc{background:#fff;min-height:72px;padding:4px 3px;vertical-align:top}
.dc.empty{background:#f9f9fb}
.dc.today{outline:2px solid #0071e3;outline-offset:-2px;background:#f0f7ff}
.dn{font-size:11px;font-weight:600;color:#636366;margin-bottom:3px;line-height:1}
.dn.sun,.dn.hol{color:#ff3b30}
.dn.sat{color:#007aff}
.dn.today-num{color:#0071e3}

/* イベントpill */
.pill{font-size:9.5px;padding:2px 4px;border-radius:3px;margin-bottom:2px;cursor:pointer;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:opacity 0.1s;border:none;width:100%;text-align:left}
.pill:active{opacity:0.65}
.more{font-size:9px;color:#8e8e93;padding:1px 3px}

/* カラー */
.ev-blue{background:#e8f2fd;color:#0c447c}
.ev-green{background:#eaf5e0;color:#3b6d11}
.ev-purple{background:#eeedfe;color:#3c3489}
.ev-amber{background:#fef3e0;color:#6b4200}
.ev-coral{background:#fcecea;color:#7d2a13}
.ev-teal{background:#e0f5ee;color:#085041}
.ev-kids{background:#fce8ef;color:#72243e}

/* 凡例 */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#636366}
.ldot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ============ モーダル ============ */
.overlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,0.55);
  z-index:1000;
  align-items:flex-end; /* スマホ: 下から */
  justify-content:center;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.overlay.open{display:flex}

/* タブレット以上は中央 */
@media(min-width:480px){
  .overlay{align-items:center;padding:16px}
}

.modal{
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:20px 20px 32px;
  width:100%;
  max-width:480px;
  position:relative;
  max-height:85vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  animation:slideUp 0.22s ease;
}
@media(min-width:480px){
  .modal{border-radius:16px;padding:24px;max-height:80vh}
}

@keyframes slideUp{
  from{transform:translateY(60px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* ドラッグハンドル風 */
.modal-handle{
  width:36px;height:4px;background:#d1d1d6;border-radius:2px;
  margin:0 auto 16px;
}
@media(min-width:480px){.modal-handle{display:none}}

.modal-close{
  position:absolute;top:14px;right:14px;
  width:30px;height:30px;border-radius:50%;
  background:#e5e5ea;border:none;
  font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:#636366;
  -webkit-tap-highlight-color:transparent;
}
.modal-close:active{background:#d1d1d6}

.modal-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:4px;margin-bottom:10px;font-weight:600}
.modal-title{font-size:17px;font-weight:600;color:#1d1d1f;margin-bottom:14px;line-height:1.4}
.modal-row{display:flex;gap:10px;margin-bottom:8px;font-size:13px}
.modal-label{color:#8e8e93;min-width:52px;flex-shrink:0;font-size:12px;padding-top:1px}
.modal-val{color:#1d1d1f;line-height:1.55}
.modal-divider{border:none;border-top:1px solid #f0f0f0;margin:12px 0}
.modal-note{font-size:12.5px;color:#636366;line-height:1.65}
.mblock{display:none}
.mblock.visible{display:block}
</style>
</head>

function isHol(mi,d){return (MONTHS[mi].holidays||[]).includes(d)}

function buildMonth(mi){
  const m=MONTHS[mi];
  const el=document.getElementById("m"+mi);
  let h=`<div class="month-label">${m.name}</div><div class="cal-grid">`;
  DOW.forEach((d,i)=>{
    const cls=i===0?"sun":i===6?"sat":"";
    h+=`<div class="dh ${cls}">${d}</div>`;
  });
  for(let i=0;i<m.start;i++) h+=`<div class="dc empty"></div>`;
  for(let d=1;d<=m.days;d++){
    const dow=(m.start+d-1)%7;
    const isToday=(mi===TODAY_MI&&d===TODAY_D);
    const hol=isHol(mi,d);
    const nc=hol||dow===0?"hol":dow===6?"sat":"";
    const evs=EVENTS[`${mi}-${d}`]||[];
    let pills="";
    evs.slice(0,3).forEach((e,ei)=>{
      pills+=`<button class="pill ${e.c}" onclick="openModal(${mi},${d},${ei})">${e.t}</button>`;
    });
    if(evs.length>3) pills+=`<div class="more">+${evs.length-3}件</div>`;
    h+=`<div class="dc${isToday?" today":""}"><div class="dn ${nc}${isToday?" today-num":""}">${d}</div>${pills}</div>`;
  }
  const total=m.start+m.days;
  const rem=(7-total%7)%7;
  for(let i=0;i<rem;i++) h+=`<div class="dc empty"></div>`;
  h+=`</div>`;
  el.innerHTML=h;
}

function showM(idx){
  document.querySelectorAll(".mblock").forEach((el,i)=>el.classList.toggle("visible",i===idx));
  document.querySelectorAll(".tab").forEach((el,i)=>el.classList.toggle("active",i===idx));
}

function openModal(mi,d,ei){
  const e=EVENTS[`${mi}-${d}`][ei];
  let rows="";
  const add=(label,val)=>{if(val) rows+=`<div class="modal-row"><span class="modal-label">${label}</span><span class="modal-val">${val}</span></div>`};
  add("日時",e.date+(e.time?" "+e.time:""));
  add("場所",e.loc);
  if(e.target) add("対象",e.target);
  if(e.cap) add("定員",e.cap);
  if(e.stuff) add("持ち物",e.stuff);
  if(e.note) rows+=`<hr class="modal-divider"><div class="modal-note">${e.note}</div>`;
  document.getElementById("modal-body").innerHTML=
    `<div class="modal-tag ${e.c}">${e.cat||"イベント"}</div>
     <div class="modal-title">${e.t}</div>${rows}`;
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeModal(ev){
  if(!ev||ev.target===document.getElementById("overlay")||ev.currentTarget.classList.contains("modal-close")){
    document.getElementById("overlay").classList.remove("open");
    document.body.style.overflow="";
  }
}

// ESCキーでも閉じる
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeModal()});

MONTHS.forEach((_,i)=>buildMonth(i));
</script>
